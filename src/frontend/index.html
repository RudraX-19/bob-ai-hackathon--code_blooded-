<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Port Pulse | Enterprise Maritime Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Clean Enterprise B2B SaaS Color Palette */
      --bg: #F4F7F9;
      --surface: #FFFFFF;
      --border: #E2E8F0;
      --text: #1E293B;
      --text-muted: #64748B;

      --primary: #0F62FE;
      --primary-hover: #0353E9;
      --primary-light: #EDF5FF;

      --status-critical: #DA1E28;
      --status-high: #F1C21B;
      --status-medium: #24A148;
      --status-low: #8A3FFC;

      --blue-10: #EDF5FF;
      --blue-20: #D0E2FF;
      --blue-60: #0F62FE;
      --blue-70: #0043CE;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* --- HEADER --- */
    header {
      background-color: var(--surface);
      height: 60px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: var(--shadow-sm);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background-color: var(--primary);
      color: white;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
    }

    .brand-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg);
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-medium);
    }

    /* --- LAYOUT --- */
    .layout-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebars */
    .sidebar {
      width: 340px;
      background-color: var(--surface);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-left {
      border-right: 1px solid var(--border);
    }

    .sidebar-right {
      border-left: 1px solid var(--border);
      width: 380px;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background-color: #F8FAFC;
    }

    .panel-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .panel-content::-webkit-scrollbar {
      width: 6px;
    }

    .panel-content::-webkit-scrollbar-thumb {
      background: #CBD5E1;
      border-radius: 3px;
    }

    /* --- KPI CARDS --- */
    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
    }

    .kpi-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
    }

    /* --- SECTION TITLES --- */
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* --- PORT LIST --- */
    .port-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .port-item:hover {
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(15, 98, 254, 0.1);
    }

    .port-item.active {
      border-color: var(--primary);
      background-color: var(--blue-10);
    }

    .port-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .port-name {
      font-weight: 600;
      font-size: 13px;
    }

    .port-score {
      font-weight: 700;
      font-size: 14px;
    }

    .score-CRITICAL {
      color: var(--status-critical);
    }

    .score-HIGH {
      color: var(--status-high);
    }

    .score-MEDIUM {
      color: var(--status-medium);
    }

    .score-LOW {
      color: var(--status-low);
    }

    .port-bar-bg {
      height: 4px;
      background-color: var(--border);
      border-radius: 2px;
      width: 100%;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .port-bar-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.5s ease;
    }

    .bg-CRITICAL {
      background-color: var(--status-critical);
    }

    .bg-HIGH {
      background-color: var(--status-high);
    }

    .bg-MEDIUM {
      background-color: var(--status-medium);
    }

    .bg-LOW {
      background-color: var(--status-low);
    }

    .port-metrics {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* --- SEARCH & LIST --- */
    .search-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      color: var(--text);
      margin-bottom: 12px;
      transition: border 0.2s;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.1);
    }

    .vessel-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vessel-item {
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .vessel-item:hover {
      background: #F8FAFC;
    }

    .vessel-info h4 {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .vessel-info p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .tag-moving {
      background: #DEFBE6;
      color: #198038;
    }

    .tag-anchored {
      background: #FFF1F1;
      color: #DA1E28;
    }

    /* --- MAP --- */
    #map {
      flex: 1;
      background: #E5E7EB;
      z-index: 1;
    }

    /* --- CHARTS --- */
    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
    }

    canvas {
      max-height: 160px;
    }

    /* --- BUTTON & AI BOX --- */
    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 16px;
      width: 100%;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-primary:disabled {
      background-color: #A6C8FF;
      cursor: not-allowed;
    }

    .ai-output-box {
      background-color: #F8FAFC;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px;
      font-family: inherit;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      max-height: 300px;
      overflow-y: auto;
      margin-top: 12px;
    }

    /* --- MAP POPUPS --- */
    .leaflet-popup-content-wrapper {
      border-radius: 8px !important;
      box-shadow: var(--shadow-md) !important;
    }

    .leaflet-popup-content {
      font-family: 'Inter', sans-serif !important;
    }

    /* --- ALERTS --- */
    .alert-banner {
      background-color: #FFF1F1;
      border-left: 4px solid var(--status-critical);
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }

    .alert-banner.show {
      display: block;
    }

    .alert-title {
      font-weight: 600;
      color: var(--status-critical);
      font-size: 12px;
      margin-bottom: 4px;
    }

    .alert-text {
      font-size: 12px;
      color: var(--text);
    }
  </style>
</head>

<body>

  <header>
    <div class="brand">
      <div class="brand-logo">P</div>
      <div class="brand-text">Port Pulse Workspace</div>
    </div>
    <div class="header-right">
      <div class="status-badge">
        <span class="status-dot"></span>
        <span id="sys-mode">IBM watsonx.ai Active</span>
      </div>
      <div class="status-badge" style="background:#F8FAFC;border:none;box-shadow:none">
        <span id="time-val" style="font-weight:600;color:var(--text)">00:00:00</span>
      </div>
    </div>
  </header>

  <div class="layout-container">

    <!-- LEFT PANEL: Operations Overview -->
    <div class="sidebar sidebar-left">
      <div class="panel-header">
        <div class="panel-title">Operations Overview</div>
      </div>
      <div class="panel-content">

        <!-- KPIs -->
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Total Fleet</div>
            <div class="kpi-value" id="kpi-total">-</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Underway</div>
            <div class="kpi-value" style="color:var(--status-medium)" id="kpi-moving">-</div>
          </div>
        </div>

        <!-- Alerts -->
        <div class="alert-banner" id="alert-banner">
          <div class="alert-title">Congestion Alert</div>
          <div class="alert-text" id="alert-text">High congestion detected.</div>
        </div>

        <!-- Ports List -->
        <div class="section-title">
          <span>Port Terminals</span>
          <span style="font-weight:400;font-size:11px;color:var(--text-muted)">Score / 100</span>
        </div>
        <div id="ports-list"></div>

        <!-- Vessel Fleet -->
        <div class="section-title" style="margin-top:24px">
          <span>Active Fleet</span>
        </div>
        <input type="text" class="search-input" id="vessel-search" placeholder="Search by MMSI or Name..."
          oninput="renderVessels()" />
        <div class="vessel-list" id="vessel-list"></div>

      </div>
    </div>

    <!-- MAP -->
    <div id="map"></div>

    <!-- RIGHT PANEL: Analytics & AI -->
    <div class="sidebar sidebar-right">
      <div class="panel-header">
        <div class="panel-title">Analytics & Operations Planning</div>
      </div>
      <div class="panel-content">

        <!-- Charts -->
        <div class="section-title">Fleet Distribution</div>
        <div class="chart-container"><canvas id="cFleet"></canvas></div>

        <div class="section-title">Vessel Types</div>
        <div class="chart-container"><canvas id="cType"></canvas></div>

        <!-- AI Ops Plan -->
        <div class="section-title" style="margin-top:32px">
          <span>AI Operations Plan</span>
          <span
            style="font-size:10px;background:var(--blue-10);color:var(--primary);padding:2px 6px;border-radius:4px">watsonx</span>
        </div>
        <button class="btn-primary" id="plan-btn" onclick="genPlan()">
          Generate 72-Hour Plan
        </button>
        <div class="ai-output-box" id="plan-out">
          Awaiting initiation...
        </div>

      </div>
    </div>

  </div>

  <script>
    const API = '', WS = `ws://${location.host}/ws`;

    // Professional color palette for ports
    const P_DATA = {
      JNPT: { c: '#0F62FE', pos: [18.95, 72.95] },
      MUNDRA: { c: '#24A148', pos: [22.839, 69.705] },
      CHENNAI: { c: '#8A3FFC', pos: [13.09, 80.299] },
      VIZAG: { c: '#DA1E28', pos: [17.6868, 83.2985] },
      COCHIN: { c: '#1192E8', pos: [9.9658, 76.2673] },
      KOLKATA: { c: '#D4BBFF', pos: [22.5726, 88.3639] }
    };

    let vessels = {}, markers = {}, pScores = {}, map, ws, actPort = null;
    let chFleet, chType;

    // Clock
    setInterval(() => {
      document.getElementById('time-val').textContent = new Date().toLocaleTimeString('en-IN');
    }, 1000);

    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([20.5, 79.0], 5);
      // Crisp, clean light map (Carto Light)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap © CARTO'
      }).addTo(map);
    }

    function getIcon(v) {
      const mov = v.speed > 0.3;
      const col = mov ? (P_DATA[v.port]?.c || '#0F62FE') : '#F1C21B';
      const html = `<div style="
    width:12px; height:12px;
    background:${col};
    border: 1.5px solid white;
    border-radius: ${mov ? '2px' : '50%'};
    transform: rotate(${v.heading || 0}deg);
    ${mov ? 'clip-path: polygon(50% 0%, 100% 100%, 50% 80%, 0% 100%); width:12px; height:16px; border:none;' : ''}
  "></div>`;
      return L.divIcon({ html, className: '', iconSize: [12, 16], iconAnchor: [6, 8] });
    }

    function getPopup(v) {
      return `<div style="padding:4px">
    <div style="font-weight:600;font-size:14px;color:var(--text);margin-bottom:8px">${v.name || 'Unknown Vessel'}</div>
    <div style="font-size:12px;color:var(--text-muted);display:grid;gap:4px">
      <div><b>MMSI:</b> ${v.mmsi}</div>
      <div><b>Port:</b> ${v.port}</div>
      <div><b>Class:</b> ${v.type || 'N/A'}</div>
      <div><b>Speed:</b> ${v.speed.toFixed(1)} kn</div>
    </div>
  </div>`;
    }

    function updateData(data) {
      if (Array.isArray(data)) data.forEach(v => vessels[v.mmsi] = v);
      else vessels[data.mmsi] = data;

      Object.values(vessels).forEach(v => {
        if (!v.lat) return;
        if (markers[v.mmsi]) markers[v.mmsi].setLatLng([v.lat, v.lon]).setIcon(getIcon(v));
        else {
          markers[v.mmsi] = L.marker([v.lat, v.lon], { icon: getIcon(v) }).addTo(map).bindPopup(getPopup(v));
        }
      });

      recalc();
    }

    function recalc() {
      const arr = Object.values(vessels);
      const f = actPort ? arr.filter(v => v.port === actPort) : arr;

      document.getElementById('kpi-total').textContent = f.length;
      document.getElementById('kpi-moving').textContent = f.filter(v => v.speed > 0.3).length;

      const hot = [];
      Object.keys(P_DATA).forEach(pk => {
        const pv = arr.filter(v => v.port === pk);
        const mo = pv.filter(v => v.speed > 0.3).length;
        // Normalize score for real live data volumes (JNPT gets ~50+ ships, Vizag ~20)
        // High density port capacities: 50 ships is nominal 100% load
        let baseLoad = pv.length / 50 * 50; 
        let anchorPenalty = (pv.length - mo) / 25 * 35;
        let s = Math.min(Math.round(baseLoad + anchorPenalty), 100);
        if (pv.length === 0) s = 0;
        const l = s >= 85 ? 'CRITICAL' : s >= 65 ? 'HIGH' : s >= 45 ? 'MEDIUM' : 'LOW';
        if (l === 'CRITICAL' || l === 'HIGH') hot.push(pk);
        pScores[pk] = { score: s, lvl: l, t: pv.length, m: mo, a: pv.length - mo };
      });

      const ab = document.getElementById('alert-banner');
      if (hot.length) { document.getElementById('alert-text').textContent = `Elevated congestion at: ${hot.join(', ')}`; ab.classList.add('show'); }
      else { ab.classList.remove('show'); }

      renderPorts(); renderVessels(); renderCharts();
    }

    function renderPorts() {
      const sorted = Object.keys(P_DATA).sort((a, b) => pScores[b].score - pScores[a].score);
      document.getElementById('ports-list').innerHTML = sorted.map(k => {
        const p = pScores[k];
        return `<div class="port-item ${actPort === k ? 'active' : ''}" onclick="selPort('${k}')">
      <div class="port-header">
        <div class="port-name">${k}</div>
        <div class="port-score score-${p.lvl}">${p.score}</div>
      </div>
      <div class="port-bar-bg"><div class="port-bar-fill bg-${p.lvl}" style="width:${p.score}%"></div></div>
      <div class="port-metrics">
        <span>Ships: ${p.t}</span><span>Mov: ${p.m}</span><span>Anc: ${p.a}</span>
      </div>
    </div>`;
      }).join('');
    }

    function selPort(p) {
      if (actPort === p) { actPort = null; map.setView([20.5, 79.0], 5); }
      else { actPort = p; map.flyTo(P_DATA[p].pos, 10); }

      Object.values(vessels).forEach(v => {
        const m = markers[v.mmsi]; if (!m) return;
        if (!actPort || v.port === actPort) map.hasLayer(m) || m.addTo(map);
        else map.hasLayer(m) && map.removeLayer(m);
      });
      recalc();
    }

    function renderVessels() {
      const q = document.getElementById('vessel-search').value.toLowerCase();
      let v = Object.values(vessels);
      if (actPort) v = v.filter(x => x.port === actPort);
      if (q) v = v.filter(x => (x.name || '').toLowerCase().includes(q) || x.mmsi.toString().includes(q));

      v.sort((a, b) => (b.speed > 0.3 ? 1 : 0) - (a.speed > 0.3 ? 1 : 0));

      document.getElementById('vessel-list').innerHTML = v.slice(0, 40).map(x => {
        const m = x.speed > 0.3;
        return `<div class="vessel-item" onclick="flyToVessel('${x.mmsi}')">
      <div class="vessel-info">
        <h4>${x.name || 'Unknown'}</h4>
        <p>${x.port} | MMSI: ${x.mmsi}</p>
      </div>
      <div class="tag ${m ? 'tag-moving' : 'tag-anchored'}">${m ? x.speed.toFixed(1) + ' kn' : 'Anchored'}</div>
    </div>`;
      }).join('');
    }

    function flyToVessel(mmsi) {
      const v = vessels[mmsi];
      if (!v) return;
      map.flyTo([v.lat, v.lon], 13, { duration: 1 });
      const m = markers[mmsi];
      if (m) m.openPopup();
    }

    function renderCharts() {
      Chart.defaults.font.family = 'Inter';
      const pK = Object.keys(P_DATA);
      const dataFleet = pK.map(k => pScores[k]?.t || 0);
      const cFleetCols = pK.map(k => P_DATA[k].c);

      if (chFleet) {
        chFleet.data.datasets[0].data = dataFleet;
        chFleet.update('none'); // no animation on rapid tick
      } else {
        chFleet = new Chart(document.getElementById('cFleet'), {
          type: 'pie', data: { labels: pK, datasets: [{ data: dataFleet, backgroundColor: cFleetCols, borderWidth: 0 }] },
          options: { plugins: { legend: { position: 'right', labels: { pointStyle: 'circle', usePointStyle: true, padding: 10, font: { size: 11 } } } }, cutout: '40%' }
        });
      }

      const types = {}; Object.values(vessels).forEach(v => { types[v.type || 'Unknown'] = (types[v.type || 'Unknown'] || 0) + 1; });
      const tL = Object.keys(types); const tD = Object.values(types);
      
      if (chType) {
        chType.data.labels = tL;
        chType.data.datasets[0].data = tD;
        chType.update('none');
      } else {
        chType = new Chart(document.getElementById('cType'), {
          type: 'bar', data: { labels: tL, datasets: [{ data: tD, backgroundColor: '#0F62FE', borderRadius: 4 }] },
          options: { scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
        });
      }
    }

    async function genPlan() {
      const b = document.getElementById('plan-btn'), o = document.getElementById('plan-out');
      b.disabled = true; b.textContent = 'Generating...';
      o.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">Requesting AI tactical plan from IBM watsonx.ai...</div>';
      try {
        const res = await fetch(`${API}/api/plan`).then(r => r.json());

        // Generate an instant visual dashboard for the brief
        const criticalPorts = Object.keys(pScores).filter(k => pScores[k].lvl === 'CRITICAL' || pScores[k].lvl === 'HIGH');
        const totalIdle = Object.values(pScores).reduce((sum, p) => sum + p.a, 0);
        const actionRequired = criticalPorts.length > 0 ? 'CRITICAL' : 'ROUTINE';
        const alertCol = criticalPorts.length ? 'var(--status-critical)' : 'var(--status-medium)';

        const diversions = res.resource_alloc ? res.resource_alloc.filter(a => a.routing_strategy.startsWith("DIVERT")) : [];
        const diversionHtml = diversions.length > 0
          ? `<div style="background: #FFF1F1; border-radius: 4px; padding: 8px 12px; flex: 1; border: 1px solid #ffcccc;">
              <div style="font-size: 10px; color: var(--status-critical);">Active Rerouting Executed</div>
              <div style="font-weight: 700; font-size: 14px; color: var(--status-critical); margin-top: 2px;">
                ${diversions.length} vessels diverted
              </div>
            </div>`
          : `<div style="background: #DEFBE6; border-radius: 4px; padding: 8px 12px; flex: 1;">
              <div style="font-size: 10px; color: #198038;">Active Rerouting</div>
              <div style="font-weight: 700; font-size: 14px; color: #198038; margin-top: 2px;">
                Off - Standard Routes
              </div>
            </div>`;

        const summaryHtml = `
          <div style="background: white; border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: 6px; padding: 12px; margin-bottom: 16px; box-shadow: var(--shadow-sm);">
            <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px; display: flex; justify-content: space-between;">
              <span>Visual Executive Summary</span>
              <span style="background: ${alertCol}; color: white; padding: 2px 6px; border-radius: 4px; font-size: 9px;">${actionRequired}</span>
            </div>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
              <div style="background: #F8FAFC; border-radius: 4px; padding: 8px 12px; flex: 1; min-width: 100px;">
                <div style="font-size: 10px; color: var(--text-muted);">Congestion Hotspots</div>
                <div style="font-weight: 700; font-size: 14px; color: ${alertCol}; margin-top: 2px;">
                  ${criticalPorts.length ? criticalPorts.join(', ') : 'None active'}
                </div>
              </div>
              <div style="background: #F8FAFC; border-radius: 4px; padding: 8px 12px; flex: 1; min-width: 100px;">
                <div style="font-size: 10px; color: var(--text-muted);">Fleet Idle Ratio</div>
                <div style="font-weight: 700; font-size: 14px; color: var(--text); margin-top: 2px;">
                  ${totalIdle} waiting
                </div>
              </div>
              ${diversionHtml}
            </div>
          </div>
        `;

        // Clean up and format the AI text string for readability
        let fText = res.plan_text
          .replace(/={3,}/g, '') // Remove heavy equals signs
          .replace(/\*{2,}/g, '') // Remove markdown asterisks if any
          .replace(/\n\n/g, '<br/><br/>')
          .replace(/\n/g, '<br/>')
          .replace(/((?:Step|Action|Priority) \d+|Immediate Actions|Operational Adjustments|Long-term Strategy)/gi, '<br><strong style="font-size:14px;color:var(--primary);display:block;margin:12px 0 4px">$1</strong>')
          .replace(/(?: - | • )/g, '<span style="color:var(--primary);font-weight:bold;margin-right:6px">•</span>');

        o.innerHTML = summaryHtml + `<div style="padding: 0 4px;">${fText}</div>`;
      } catch (e) { o.innerHTML = `<div style="color:var(--status-critical)">Error: ${e.message}</div>`; }
      b.disabled = false; b.textContent = 'Regenerate Plan';
    }

    async function boot() {
      initMap();
      try {
        const h = await fetch(`${API}/api/health`).then(r => r.json());
        document.getElementById('sys-mode').textContent = h.watsonx_mode === 'live' ? 'watsonx.ai Available' : 'Mock Mode';
        document.getElementById('sys-mode').style.color = h.watsonx_mode === 'live' ? 'var(--status-medium)' : 'var(--text-muted)';
      } catch (e) { }

      for (let pk in P_DATA) {
        try {
          await fetch(`${API}/api/ports/${pk}`, { method: 'POST' });
          const pd = await fetch(`${API}/api/vessels`).then(r => r.json());
          updateData(pd);
        } catch (e) { }
      }

      ws = new WebSocket(WS);
      ws.onmessage = e => {
        let msg = JSON.parse(e.data);
        if (msg.type === 'snapshot' || msg.type === 'vessel_update') updateData(msg.data);
        else if (msg.type === 'heartbeat') recalc();
      }
    }
    boot();
  </script>
</body>

</html>
