name: Validate Submission

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check submission.yaml exists
        run: test -f submission.yaml || (echo "ERROR: submission.yaml not found" && exit 1)

      - name: Validate submission.yaml fields
        run: |
          python3 - <<'EOF'
          import yaml, sys
          with open("submission.yaml") as f:
              data = yaml.safe_load(f)
          errors = []
          team = data.get("team", {})
          if not team.get("name") or "YOUR_TEAM" in str(team.get("name","")):
              errors.append("team.name is empty or still a placeholder")
          lead = team.get("lead", {})
          if not lead.get("name") or "YOUR_NAME" in str(lead.get("name","")):
              errors.append("team.lead.name is empty or still a placeholder")
          if not lead.get("email") or "example.com" in str(lead.get("email","")):
              errors.append("team.lead.email is empty or still a placeholder")
          sub = data.get("submission", {})
          if not sub.get("title"):
              errors.append("submission.title is empty")
          if not sub.get("problem_statement"):
              errors.append("submission.problem_statement is empty")
          if not sub.get("solution_summary"):
              errors.append("submission.solution_summary is empty")
          if errors:
              for e in errors: print(f"ERROR: {e}")
              sys.exit(1)
          print("submission.yaml validation passed")
          EOF

      - name: Check required docs
        run: |
          test -f docs/setup-guide.md        || (echo "ERROR: docs/setup-guide.md missing" && exit 1)
          test -f docs/problem-statement.md  || (echo "ERROR: docs/problem-statement.md missing" && exit 1)
          test -f docs/solution-overview.md  || (echo "ERROR: docs/solution-overview.md missing" && exit 1)
          test -f docs/architecture.md       || (echo "ERROR: docs/architecture.md missing" && exit 1)
          echo "All docs present"

      - name: Check demo files
        run: |
          test -f demo/demo-video-link.txt || (echo "ERROR: demo/demo-video-link.txt missing" && exit 1)
          test -f demo/live-demo-url.txt   || (echo "ERROR: demo/live-demo-url.txt missing" && exit 1)
          echo "Demo files present"

      - name: Check src has Python code
        run: |
          count=$(find src -name "*.py" | wc -l)
          if [ "$count" -lt 2 ]; then
            echo "ERROR: src/ has fewer than 2 Python files"
            exit 1
          fi
          echo "src/ has $count Python files - OK"

      - name: All checks passed
        run: echo "Submission validated successfully"
