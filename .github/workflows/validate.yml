name: Validate Submission

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check submission.yaml exists
        run: test -f submission.yaml

      - name: Check submission.yaml required fields
        run: python3 validate_check.py

      - name: Check docs exist
        run: |
          test -f docs/setup-guide.md
          test -f docs/problem-statement.md
          test -f docs/solution-overview.md
          test -f docs/architecture.md

      - name: Check demo files exist
        run: |
          test -f demo/demo-video-link.txt
          test -f demo/live-demo-url.txt

      - name: Check src has Python code
        run: |
          count=$(find src -name "*.py" | wc -l)
          echo "Python files found: $count"
          test "$count" -ge 2

      - name: All checks passed
        run: echo "Submission validated successfully"
